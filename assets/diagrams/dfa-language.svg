<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-labelledby="title desc">
<title id="title">A language selects some binary strings</title><desc id="desc">Within all binary strings, strings ending in 1 form a smaller collection. Some sample members are 1, 01, and 101. Nonmembers include 0, 10, and the empty string.</desc>
<rect x="2" y="2" width="796" height="376" rx="18" fill="#f4f7fb" stroke="#445c76" stroke-width="2"/>
<g font-family="system-ui, sans-serif" fill="#15324f"><text x="30" y="42" font-size="23" font-weight="600">All finite binary strings</text><text x="30" y="70" font-size="16">Built from the alphabet {0, 1}</text></g>
<rect x="300" y="94" width="460" height="224" rx="28" fill="#d9efe9" stroke="#236e60" stroke-width="3"/>
<g font-family="system-ui, sans-serif" fill="#154f45"><text x="328" y="130" font-size="21" font-weight="600">Our language L</text><text x="328" y="158" font-size="18">Strings ending in 1</text></g>
<g font-family="monospace" font-size="32" fill="#143f38"><text x="350" y="220">1</text><text x="475" y="220">01</text><text x="620" y="220">101</text></g>
<g font-family="monospace" font-size="32" fill="#15324f"><text x="60" y="158">0</text><text x="175" y="210">10</text><text x="60" y="264">ε</text></g>
<g font-family="system-ui, sans-serif" font-size="16" fill="#43586c"><text x="90" y="265">empty string</text><text x="30" y="352">Only a few examples are shown. Neither collection is fully listed.</text></g></svg>